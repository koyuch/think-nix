# Git hooks, run with `prek` (drop-in pre-commit replacement). CI runs the same file.
# All hooks are `language: system`: binaries come from the flake devShell (pinned by
# flake.lock), so nothing is downloaded at hook time. Install once: `prek install`.
default_install_hook_types: [pre-commit]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        language: system
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false
        stages: [pre-commit]
      - id: nixfmt
        name: nixfmt
        language: system
        entry: nixfmt
        files: \.nix$
        exclude: ^hardware-configuration\.nix$ # generated by nixos-generate-config
      - id: deadnix
        name: deadnix
        language: system
        # --no-lambda-arg: unused module/flake args ({ config, ... }, @inputs) are idiomatic
        entry: deadnix --fail --no-lambda-arg --no-lambda-pattern-names
        files: \.nix$
        exclude: ^hardware-configuration\.nix$
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        types: [shell]
        exclude: (^|/)\.envrc$ # direnv stdlib, not plain sh
